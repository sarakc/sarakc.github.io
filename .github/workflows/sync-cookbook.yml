name: Sync cookbook from Google Docs

on:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 09:17 UTC; run it by hand after a big edit.
    - cron: '17 9 * * 1'

permissions:
  contents: write

concurrency:
  group: warm-kitchen-cookbook-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Generate the cookbook from Google Docs
        run: node scripts/update-warm-kitchen-cookbook.mjs

      - name: Check for cookbook changes
        id: changes
        run: |
          if git diff --quiet -- public/warm-kitchen/cookbook/index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the refreshed cookbook
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/warm-kitchen/cookbook/index.html
          git commit -m "chore: sync warm kitchen cookbook"
          git push

      - name: Install and build
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
